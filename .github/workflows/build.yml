name: build
on:
  push: {branches: [main, master], tags: ['v*']}
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{{{ matrix.os }}}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
        shell: bash
      - name: Byte-compile (syntax check)
        run: python -m compileall -q . || true
        shell: bash
      - name: Package source
        run: |
          python - <<'PY'
          import zipfile,os
          name=os.environ.get('GITHUB_REPOSITORY','project').split('/')[-1]
          z=zipfile.ZipFile(f'{name}-${{{{ runner.os }}}}.zip','w',zipfile.ZIP_DEFLATED)
          for r,_,fs in os.walk('.'):
              if '/.git' in r: continue
              for f in fs:
                  p=os.path.join(r,f)
                  if '.git/' in p: continue
                  z.write(p)
          PY
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{{{ github.event.repository.name }}}}-${{{{ runner.os }}}}
          path: "*.zip"
